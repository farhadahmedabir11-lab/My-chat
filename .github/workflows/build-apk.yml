name: Build Android Debug APK and Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "JAVA_HOME=${JAVA_HOME:-<unset>}"
          JAVA_VERSION_OUTPUT=$(java -version 2>&1)
          echo "$JAVA_VERSION_OUTPUT"
          VERSION_STRING=$(echo "$JAVA_VERSION_OUTPUT" | sed -n 's/.*version "\([^"]*\)".*/\1/p' | head -n 1)
          if [ -z "$VERSION_STRING" ]; then
            echo "Error: Failed to detect active Java version." >&2
            exit 1
          fi
          FIRST_PART=$(echo "$VERSION_STRING" | cut -d. -f1)
          if [ "$FIRST_PART" = "1" ]; then
            MAJOR_VERSION=$(echo "$VERSION_STRING" | cut -d. -f2)
          else
            MAJOR_VERSION="$FIRST_PART"
          fi
          if ! echo "$MAJOR_VERSION" | grep -Eq '^[0-9]+$'; then
            echo "Error: Could not parse Java major version from '$VERSION_STRING'." >&2
            exit 1
          fi
          echo "Detected Java major version: $MAJOR_VERSION"
          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "Error: Java 17 or newer is required, but detected Java $MAJOR_VERSION." >&2
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Verify Gradle version
        run: |
          GRADLE_OUTPUT=$(gradle --version)
          echo "$GRADLE_OUTPUT"
          if ! echo "$GRADLE_OUTPUT" | grep -Eq '^Gradle 9\.3\.1([[:space:]]|$)'; then
            echo "Error: Expected Gradle 9.3.1, but detected a different version." >&2
            exit 1
          fi

      - name: Create temporary debug keystore
        run: |
          KEYTOOL_BIN="${JAVA_HOME:+$JAVA_HOME/bin/}keytool"
          if ! command -v "$KEYTOOL_BIN" >/dev/null 2>&1; then
            echo "Error: keytool not found in configured Java 17 installation." >&2
            exit 1
          fi
          if [ ! -f "./debug.keystore" ]; then
            "$KEYTOOL_BIN" -genkeypair \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -noprompt
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "Error: Failed to create ./debug.keystore." >&2
            exit 1
          fi
          echo "Temporary debug keystore is ready at ./debug.keystore."

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -e "$APK_PATH" ]; then
            echo "Error: Expected debug APK not found at $APK_PATH" >&2
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered APK paths inside app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name "*.apk" -print || true
            else
              echo "Directory app/build/outputs/apk does not exist." >&2
            fi
            exit 1
          fi
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: $APK_PATH is not a regular file." >&2
            exit 1
          fi
          if [ ! -s "$APK_PATH" ]; then
            echo "Error: $APK_PATH is empty." >&2
            exit 1
          fi
          case "$APK_PATH" in
            *.apk) ;;
            *)
              echo "Error: $APK_PATH does not have a .apk extension." >&2
              exit 1
              ;;
          esac
          echo "Verified debug APK: $APK_PATH ($(wc -c < "$APK_PATH") bytes)"

      - name: Upload debug APK artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          RAW_REPO="${GITHUB_REPOSITORY#*/}"
          SAFE_REPO=$(echo "$RAW_REPO" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//')
          if [ -z "$SAFE_REPO" ]; then
            SAFE_REPO="android-app"
          fi
          TEMP_DIR=$(mktemp -d "${RUNNER_TEMP:-/tmp}/apk-release.XXXXXX")
          ASSET_NAME="${SAFE_REPO}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          ASSET_PATH="${TEMP_DIR}/${ASSET_NAME}"
          cp "app/build/outputs/apk/debug/app-debug.apk" "$ASSET_PATH"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Prepared release asset is missing or empty." >&2
            exit 1
          fi
          case "$ASSET_PATH" in
            *.apk) ;;
            *)
              echo "Error: Prepared release asset must have a .apk extension." >&2
              exit 1
              ;;
          esac
          echo "Prepared release asset: $ASSET_NAME"
          {
            echo "asset_path=$ASSET_PATH"
            echo "asset_name=$ASSET_NAME"
          } >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_asset.outputs.asset_path }}
        run: |
          gh --version
          if [ -z "$ASSET_PATH" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Prepared release asset does not exist or is empty." >&2
            exit 1
          fi
          case "$ASSET_PATH" in
            *.apk) ;;
            *)
              echo "Error: Prepared release asset does not have a .apk extension." >&2
              exit 1
              ;;
          esac

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          RELEASE_NOTES=$(printf '%s\n' \
            "This is an automatically generated debug APK." \
            "" \
            "- **Built by:** GitHub Actions" \
            "- **Run Number:** ${GITHUB_RUN_NUMBER}" \
            "- **Run Attempt:** ${GITHUB_RUN_ATTEMPT}" \
            "- **Source Commit SHA:** ${GITHUB_SHA}" \
            "- **Signing:** Debug signing" \
            "" \
            "This APK is intended for testing only and is not a Play Store production release.")

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --target "$GITHUB_SHA" \
            --notes "$RELEASE_NOTES" \
            --latest

      - name: Report APK download result
        if: ${{ always() && steps.upload_artifact.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_NAME: ${{ steps.prepare_asset.outputs.asset_name }}
        run: |
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url --jq '.url')
            RELEASE_TITLE=$(gh release view "$RELEASE_TAG" --json name --jq '.name')
            RELEASE_ASSET=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -Fx "$ASSET_NAME" | head -n 1 || true)
            if [ -z "$RELEASE_URL" ] || [ -z "$RELEASE_ASSET" ]; then
              echo "::warning::Release was created, but release asset verification via gh release view was incomplete."
            fi
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: ${RELEASE_TITLE:-Debug APK Build #$GITHUB_RUN_NUMBER}"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Filename: ${RELEASE_ASSET:-$ASSET_NAME}"
            {
              echo "### Debug APK Build & GitHub Release Published"
              echo ""
              echo "- **Release Tag:** \`$RELEASE_TAG\`"
              echo "- **Release Title:** ${RELEASE_TITLE:-Debug APK Build #$GITHUB_RUN_NUMBER}"
              echo "- **Release Page URL:** $RELEASE_URL"
              echo "- **APK Asset Filename:** \`${RELEASE_ASSET:-$ASSET_NAME}\`"
              echo ""
              echo "The APK can be downloaded directly from the **Assets** section of the release page above."
              echo "The normal GitHub Actions artifact (\`app-debug-apk\`) is also available as a backup."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing failed for tag $RELEASE_TAG. The debug APK build succeeded and the GitHub Actions artifact 'app-debug-apk' remains available."
            {
              echo "### Debug APK Build Succeeded (GitHub Release Publishing Warning)"
              echo ""
              echo "> **Warning:** GitHub Release publishing failed for tag \`$RELEASE_TAG\`."
              echo ""
              echo "- **APK Build:** Succeeded (\`app/build/outputs/apk/debug/app-debug.apk\`)"
              echo "- **Backup Artifact:** Download the GitHub Actions artifact named \`app-debug-apk\` from this workflow run."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
